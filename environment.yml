name: tree_ensembles
channels:
  - conda-forge
dependencies:
  - python=3.12
  # core
  - numpy
  - pandas
  - scikit-learn
  - xgboost
  - optuna
  # bart extra (bartz itself comes from pip below)
  - matplotlib
  # notebooks
  - jupyter
  - ipykernel
  # dev tools
  - ruff
  - mypy
  - pandas-stubs
  - pytest
  - pre-commit
  - pip
  - pip:
      - -e .[bart]
