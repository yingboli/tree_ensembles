[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tree_ensembles"
version = "0.2.0"
description = "Tree ensembles (XGBoost, BART) for R&D and learning."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy", "pandas", "scikit-learn", "xgboost", "optuna"]

[project.optional-dependencies]
# bartz pinned to a minor version: tree_ensembles.bart.trees reads its internal trace layout.
bart = ["bartz>=0.12.1,<0.13", "matplotlib"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, UP: modern syntax, B: common bugs
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
disallow_untyped_defs = true
ignore_missing_imports = true  # sklearn has no type stubs

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
